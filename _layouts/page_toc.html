---
layout: default
---

<article class="page site-shell document-shell">
  <header class="page-header page-header--document">
    <p class="eyebrow">Guidance</p>
    <h1>{{ page.title }}</h1>
  </header>

  <details class="mobile-toc">
    <summary>On this page</summary>
    <nav aria-label="Table of contents">
      {% include toc.html html=content sanitize=true class="toc-list" h_min=1 h_max=3 %}
    </nav>
  </details>

  <div class="document-grid">
    <aside class="document-toc">
      <p>On this page</p>
      <nav aria-label="Table of contents">
        {% include toc.html html=content sanitize=true class="toc-list" h_min=1 h_max=3 %}
      </nav>
    </aside>

    <div class="entry prose document-content">
      {{ content }}
    </div>
  </div>
</article>
